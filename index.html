<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Runenfurt</title>
<meta name="description" content="Runenfurt – Kartenkämpfe in Echtzeit gegen den Computer. Läuft ohne Internet.">
<meta name="theme-color" content="#0d1c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runenfurt">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="boot.js"></script>
<script type="module" src="main.js"></script>
</head>
<body>
<div id="probe" aria-hidden="true"></div>

<section id="home" class="screen">
  <header class="bar">
    <div class="pill" id="lvlPill"><span class="lvl"><b id="lvlNum">1</b></span><span class="xp"><i id="xpFill"></i></span></div>
    <div class="pill gold"><span class="ico coin"></span><b id="goldNum">0</b></div>
    <button class="round" id="soundBtn" aria-label="Ton an oder aus"></button>
  </header>
  <div class="hero">
    <canvas id="emblem" width="320" height="320" aria-hidden="true"></canvas>
    <h1>Runenfurt</h1>
  </div>
  <div class="arenaBox">
    <div class="arenaName"><small id="arenaNo">Arena 1</small><b id="arenaName">Moosgrund</b></div>
    <div class="trophies"><span class="ico trophy"></span><b id="trophyNum">0</b></div>
    <div class="track"><i id="trophyFill"></i></div>
    <div class="hint" id="arenaHint"></div>
  </div>
  <div class="seg" id="levelSeg" role="group" aria-label="Schwierigkeit">
    <button data-level="leicht">Leicht</button><button data-level="mittel">Mittel</button><button data-level="schwer">Schwer</button>
  </div>
  <button class="big" id="playBtn">Kampf</button>
  <div class="row">
    <button class="btn" id="deckBtn">Karten &amp; Deck<span class="dot" id="deckDot" hidden></span></button>
    <button class="btn" id="helpBtn">So geht’s</button>
  </div>
  <div class="stats" id="stats"></div>
</section>

<section id="deck" class="screen" hidden>
  <header class="bar">
    <button class="round back" id="deckBack" aria-label="Zurück"></button>
    <h2>Karten &amp; Deck</h2>
    <div class="pill gold"><span class="ico coin"></span><b id="goldNum2">0</b></div>
  </header>
  <div class="scroll">
    <div class="sub"><b>Dein Deck</b><span id="avgCost"></span></div>
    <div class="swapHint" id="swapHint" hidden></div>
    <div class="grid" id="deckGrid"></div>
    <div class="sub"><b>Sammlung</b><span id="collCount"></span></div>
    <div class="grid" id="collGrid"></div>
  </div>
</section>

<section id="battle" class="screen" hidden>
  <div id="hud">
    <div class="score foe"><span class="ico crown"></span><b id="crownFoe">0</b></div>
    <div id="clock"><b id="time">3:00</b><small id="phase"></small></div>
    <div class="score me"><b id="crownMe">0</b><span class="ico crown"></span></div>
    <button class="round pause" id="pauseBtn" aria-label="Pause"></button>
  </div>
  <div id="arenaWrap">
    <canvas id="arena"></canvas>
    <canvas id="labels" aria-hidden="true"></canvas>
    <div id="abilities"></div>
    <div id="banner" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <div id="panel">
    <div id="handRow">
      <div id="next"><small>Nächste</small><div id="nextCard"></div></div>
      <div id="hand"></div>
    </div>
    <div id="kraft"><div id="kraftBar"><i id="kraftFill"></i><span class="ticks"></span></div><b id="kraftNum">5</b></div>
  </div>
</section>

<div id="overlay" hidden><div id="sheet"></div></div>
</body>
</html>
