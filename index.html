<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Runenfurt</title>
<meta name="description" content="Runenfurt – Kartenkämpfe in Echtzeit gegen den Computer. Läuft ohne Internet.">
<meta name="theme-color" content="#0d1c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runenfurt">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="boot.js"></script>
<script type="module" src="main.js"></script>
</head>
<body>
<div id="probe" aria-hidden="true"></div>

<section id="menu" class="screen">
  <header class="bar">
    <button class="pill" id="lvlPill" aria-label="Profil"><span class="lvl"><b id="lvlNum">1</b></span><span class="xp"><i id="xpFill"></i></span></button>
    <div class="pill gold"><span class="ico coin"></span><b id="goldNum">0</b></div>
    <div class="pill"><span class="ico gem"></span><b id="gemNum">0</b></div>
  </header>

  <!-- Kampf -->
  <div class="tab" id="tabHome">
    <button class="arenaBox" id="arenaBox">
      <div class="arenaName"><small id="arenaNo">Arena 1</small><b id="arenaName">Moosgrund</b></div>
      <div class="trophies"><span class="ico trophy"></span><b id="trophyNum">0</b></div>
      <div class="track"><i id="trophyFill"></i></div>
      <div class="hint" id="arenaHint"></div>
    </button>
    <div class="hero" id="stage">
      <canvas id="stageCv" aria-hidden="true"></canvas>
      <div class="sideCol left">
        <button class="sideBtn" id="questBtn"><span class="ico qico"></span><b>Aufgaben</b><small id="questInfo"></small><span class="dot" id="questDot" hidden></span></button>
        <button class="sideBtn" id="passBtn"><span class="ico pfad"></span><b>Runenpfad</b><small id="passInfo"></small><i class="mini"><i id="passFill"></i></i><span class="dot" id="passDot" hidden></span></button>
      </div>
      <div class="sideCol right">
        <button class="sideBtn" id="itemsBtn"><span class="ico joker"></span><b>Sonderdinge</b><small id="itemsInfo"></small><span class="dot" id="itemsDot" hidden></span></button>
        <button class="sideBtn" id="deckBtn"><span class="ico ncards"></span><b id="deckName">Deck 1</b><small id="deckInfo"></small></button>
      </div>
      <div class="who" id="who"></div>
    </div>
    <div class="seg" id="levelSeg" role="group" aria-label="Schwierigkeit">
      <button data-level="leicht">Leicht</button><button data-level="mittel">Mittel</button><button data-level="schwer">Schwer</button>
    </div>
    <div class="playRow">
      <button class="big" id="playBtn"><span>Kampf</span><small id="playInfo"></small></button>
      <button class="btn side" id="modeBtn"><span class="ico nfight"></span>Modi<span class="dot" id="modeDot" hidden></span></button>
    </div>
    <div class="chestRow" id="chestRow" aria-label="Tagessiege"></div>
    <div class="stats" id="stats"></div>
  </div>

  <!-- Karten -->
  <div class="tab" id="tabCards" hidden>
    <div class="scroll">
      <div id="upBox" hidden>
        <div class="sub"><b>Bereit zum Aufwerten</b><span id="upSum"></span></div>
        <div class="upRow" id="upRow"></div>
      </div>
      <div class="row helpers">
        <button class="btn tile" id="wishBtn"><span class="ico star"></span><span><b>Wunschkarte</b><small id="wishInfo"></small></span></button>
        <button class="btn tile" id="jokerBtn"><span class="ico joker"></span><span><b id="jokerNum">0 Joker</b><small>und andere Sonderdinge</small></span></button>
      </div>
      <button class="btn tile wideTile" id="mastBtn" hidden><span class="ico coin"></span><span><b>Kartenmeisterschaft</b><small id="mastInfo"></small></span><em>Abholen</em></button>
      <div class="sub"><b>Dein Deck</b><span id="avgCost"></span></div>
      <div class="seg small" id="slotSeg" role="group" aria-label="Deck-Platz"></div>
      <div class="swapHint" id="swapHint" hidden></div>
      <div class="grid" id="deckGrid"></div>
      <div class="sub"><b>Türme</b><span id="towerInfo"></span></div>
      <div class="grid" id="towerGrid"></div>
      <div class="sub"><b>Sammlung</b><span id="collCount"></span></div>
      <div class="chips" id="filterChips"></div>
      <div class="chips sortChips" id="sortChips"></div>
      <div class="grid" id="collGrid"></div>
    </div>
  </div>

  <!-- Laden -->
  <div class="tab" id="tabShop" hidden>
    <div class="scroll" id="shopBody"></div>
  </div>

  <!-- Wege: Trophäenweg, Runenpfad, Sammlung -->
  <div class="tab" id="tabRoad" hidden>
    <div class="seg small" id="waySeg" role="group" aria-label="Wege"></div>
    <div class="scroll" id="roadBody"></div>
  </div>

  <!-- Mehr -->
  <div class="tab" id="tabMore" hidden>
    <div class="scroll" id="moreBody"></div>
  </div>

  <nav id="nav">
    <i id="navGlow" aria-hidden="true"></i>
    <button data-tab="shop"><span class="ico nshop"></span><small>Laden</small><span class="dot" hidden></span></button>
    <button data-tab="cards"><span class="ico ncards"></span><small>Karten</small><span class="dot" hidden></span></button>
    <button data-tab="home" class="on"><span class="ico nfight"></span><small>Kampf</small><span class="dot" hidden></span></button>
    <button data-tab="road"><span class="ico nroad"></span><small>Weg</small><span class="dot" hidden></span></button>
    <button data-tab="more"><span class="ico nmore"></span><small>Mehr</small><span class="dot" hidden></span></button>
  </nav>
</section>

<section id="battle" class="screen" hidden>
  <div id="hud">
    <div class="score foe"><span class="ico crown"></span><b id="crownFoe">0</b><small id="foeName"></small></div>
    <div id="clock"><b id="time">3:00</b><small id="phase"></small></div>
    <div class="score me"><b id="crownMe">0</b><span class="ico crown"></span></div>
    <button class="round pause" id="pauseBtn" aria-label="Pause"></button>
  </div>
  <div id="arenaWrap">
    <canvas id="arena"></canvas>
    <canvas id="labels" aria-hidden="true"></canvas>
    <div id="abilities"></div>
    <div id="fps" hidden></div>
    <div id="banner" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <div id="panel">
    <div id="handRow">
      <div id="next"><small>Nächste</small><div id="nextCard"></div></div>
      <div id="hand"></div>
    </div>
    <div id="kraft"><div id="kraftBar"><i id="kraftFill"></i><span class="ticks"></span></div><b id="kraftNum">5</b></div>
  </div>
</section>

<div id="overlay" hidden><div id="sheet"></div></div>
<div id="fx" hidden></div>
</body>
</html>
